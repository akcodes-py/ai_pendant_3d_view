<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Brain2 AI Pendant 3D Viewer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='18,4 46,4 60,18 60,46 46,60 18,60 4,46 4,18' fill='%230f172a' stroke='%2338bdf8' stroke-width='3.5'/%3E%3Ccircle cx='32' cy='22' r='5.5' fill='%2300e5ff'/%3E%3Ccircle cx='32' cy='38' r='6.5' fill='%231e293b' stroke='%2394a3b8' stroke-width='2'/%3E%3Ccircle cx='20' cy='24' r='2.5' fill='%23d97706'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #070b14;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .badge {
      font-size: 0.8rem;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 {
      font-size: 3.5rem;
      margin: 0 0 10px 0;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 1rem;
      color: #94a3b8;
      max-width: 440px;
      margin: 0 0 24px 0;
      line-height: 1.5;
    }
    a.btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      transition: all 0.2s ease;
    }
    a.btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.6);
    }
  </style>
</head>
<body>
  <div class="badge">404 Error</div>
  <h1>Page Not Found</h1>
  <p>The requested model page or document path does not exist. Return to the live 3D CAD & electronics assembly viewer.</p>
  <a class="btn" href="./">Return to 3D Viewer</a>
</body>
</html>
